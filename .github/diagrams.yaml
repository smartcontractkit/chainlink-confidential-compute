# Mermaid diagrams generated by .github/scripts/gen_diagrams.py.
#
# Each entry declares the sources a diagram is derived from. CI recomputes a
# digest over those sources on every PR and regenerates only the diagrams whose
# sources changed. To reword a diagram, edit its `instructions` — that text is
# part of the digest, so the change alone triggers a regeneration.

max_output_tokens: 65536
budget_chars: 320000

diagrams:
  - id: enclave-architecture
    output: docs/diagrams/enclave-architecture.md
    title: Enclave Architecture
    kind: flowchart
    instructions: |
      Draw the internal architecture of a running enclave: what executes inside
      the Nitro trust boundary, what runs outside it on the untrusted host, and
      every channel that crosses between them.

      Use a subgraph for the Nitro enclave and a subgraph for the host, and make
      the trust boundary the most visible feature of the diagram.

      Inside the enclave, show the startup path and the long-lived components:
      the runner that brings up the HTTP server, the routes the server exposes,
      the service interfaces it depends on (attestation, keychain, combiner,
      signature verification, event emission) with the concrete Nitro-backed
      implementation named, and the entropy source.

      On the host, show the component that terminates inbound HTTP, the outbound
      proxy server, and the on-chain config tracker.

      For the crossings, name the AF_VSOCK ports and the direction of each, and
      show which side initiates. Include the egress path an app uses to reach
      the internet through the host proxy, and the policy check that path is
      subject to.

      Show the three apps that can be built into an enclave as interchangeable
      payloads behind a common app interface rather than drawing each one's
      internals.
    sources:
      - label: enclave bootstrap and server
        paths:
          - enclave/nitro/starter.go
          - enclave/nitro/types.go
          - enclave/nitro/entropy.go
          - enclave/server/server.go
          - enclave/server/memory.go
          - enclave/server/response_emitter.go
      - label: host side
        paths:
          - enclave/nitro/host/host.go
          - enclave/nitro/host/public_data.go
          - enclave/nitro/host/proxy-server/server.go
          - enclave/nitro/host/proxy-server/policy.go
          - enclave/nitro/proxy-client/client.go
          - enclave/nitro/proxy-client/policy.go
      - label: enclave services
        paths:
          - enclave/services/**/*.go
      - label: config tracker
        paths:
          - enclave/config-tracker/*.go
        outline: true
      - label: app payloads
        paths:
          - enclave/apps/*/app/app.go
        outline: true

  - id: client-to-enclave-flow
    output: docs/diagrams/client-to-enclave-flow.md
    title: Client to Enclave Request Flow
    kind: sequenceDiagram
    instructions: |
      Draw the end-to-end path of a single capability request, from the CRE node
      invoking the capability through to the response being returned.

      Trace it through the actual call sites in the sources: the executor that
      receives the capability request, how it selects and acquires an enclave
      from the pool, the client call it makes, the attestation validation of the
      enclave's public keys, the enclave-side handling, and the response path
      back.

      Show, as distinct interactions:

      - How the pool warms, refreshes or invalidates its view of the available
        enclaves, and what happens when a selected enclave is unhealthy.
      - Where attestation and measurement validation happen relative to the
        request being sent, and what the client does when no listed measurement
        validates.
      - The quorum or multi-enclave behaviour the executor implements, if the
        sources show one, including which participants it waits for.
      - The timeout and retry boundaries, naming the concrete timeout the
        sources define.

      Use `Note over` for the encryption and signing steps so it is clear which
      participant holds which key. Include the failure branches with `alt` /
      `else` blocks rather than drawing only the happy path.
    sources:
      - label: capability executor
        paths:
          - capabilities/framework/executor.go
          - capabilities/framework/executor_request_timeout.go
          - capabilities/framework/base_action.go
          - capabilities/framework/types.go
      - label: enclave client and pool
        paths:
          - enclave-client/pool.go
          - enclave-client/client.go
          - enclave-client/enclave-selector/*.go
          - enclave-client/attestation-validator/validator.go
      - label: enclave request handling
        paths:
          - enclave/server/server.go
        outline: true
