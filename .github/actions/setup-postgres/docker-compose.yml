services:
  postgres:
    ports:
      - "5432:5432"
    container_name: cl_pg
    # 15.20 adds pg_attver, which breaks preparetest's schema comparison.
    image: postgres:15.19-alpine
    command: postgres ${POSTGRES_OPTIONS}
    env_file:
      - .env
    healthcheck:
      test: "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"
      interval: 2s
      timeout: 5s
      retries: 5
